name: Publish Docker images to GHCR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: meta_web
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}/web" >> "$GITHUB_OUTPUT"
      - name: Image names (services)
        id: meta_svc
        run: |
          echo "room=${REGISTRY}/${GITHUB_REPOSITORY,,}/room" >> "$GITHUB_OUTPUT"
          echo "storage=${REGISTRY}/${GITHUB_REPOSITORY,,}/storage" >> "$GITHUB_OUTPUT"
      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta_web.outputs.image }}:latest
            ${{ steps.meta_web.outputs.image }}:${{ github.ref_name }}
      - name: Build room
        uses: docker/build-push-action@v6
        with:
          context: ./collab
          push: true
          tags: |
            ${{ steps.meta_svc.outputs.room }}:latest
            ${{ steps.meta_svc.outputs.room }}:${{ github.ref_name }}
      - name: Build storage
        uses: docker/build-push-action@v6
        with:
          context: ./storage
          push: true
          tags: |
            ${{ steps.meta_svc.outputs.storage }}:latest
            ${{ steps.meta_svc.outputs.storage }}:${{ github.ref_name }}
