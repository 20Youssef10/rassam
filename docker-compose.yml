services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8088:80"
    depends_on:
      - room
      - storage
    environment:
      - VITE_RASSAM_WS_URL=/
      - VITE_RASSAM_STORAGE_URL=/api
    restart: unless-stopped

  room:
    build: ./collab
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      - ROOM_PORT=3002
      - CORS_ORIGIN=
    restart: unless-stopped

  storage:
    build: ./storage
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - STORAGE_PORT=8080
      - STORAGE_URI=filesystem:///data
      - CORS_ORIGIN=
      - STORAGE_AUTH_TOKEN=${STORAGE_AUTH_TOKEN:-}
      - STORAGE_AUTH_TOKEN_FILE=/run/secrets/storage_auth_token
      - STORAGE_REQUIRE_AUTH_READ=${STORAGE_REQUIRE_AUTH_READ:-false}
      - STORAGE_WRITE_RATE_LIMIT=${STORAGE_WRITE_RATE_LIMIT:-120}
      - STORAGE_MAX_BYTES=${STORAGE_MAX_BYTES:-8388608}
      - TRUST_PROXY=${TRUST_PROXY:-false}
    volumes:
      - rassam-data:/data
    restart: unless-stopped

volumes:
  rassam-data:
